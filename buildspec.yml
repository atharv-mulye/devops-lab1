version: 0.2

phases:
  install:
    commands:
      - pip install flake8 pytest

  pre_build:
    commands:
      - echo "Running lint..."
      - flake8 app.py
      - echo "Running unit tests..."
      - pytest test_app.py -v
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 522189039465.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo "Building Docker image..."
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - docker build -t $ECR_URI:$IMAGE_TAG .
      - echo "Pushing image with commit SHA tag..."
      - docker push $ECR_URI:$IMAGE_TAG
      - echo "Tagging latest..."
      - docker tag $ECR_URI:$IMAGE_TAG $ECR_URI:latest
      - echo "Pushing latest tag..."
      - docker push $ECR_URI:latest

  post_build:
    commands:
      - echo "Build complete. Image tag $IMAGE_TAG pushed to ECR."
      